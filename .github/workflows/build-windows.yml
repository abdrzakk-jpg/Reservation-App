name: Build Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      - name: Install uv
        run: pip install uv

      - name: Install project dependencies
        run: uv sync

      - name: Install PyInstaller
        run: uv pip install pyinstaller

      - name: Build executable
        run: >
          uv run pyinstaller
          --windowed
          --name Appointments
          --add-data "app;app"
          --add-data "static;static"
          --add-data "main.py;."
          --add-data ".env;."
          UI.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Appointments-Windows
          path: dist/