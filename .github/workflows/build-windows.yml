name: Build Windows

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      - name: Install uv
        run: |
          pip install uv

      - name: Install dependencies
        run: |
          uv sync

      - name: Build application
        run: |
          uv run pyinstaller --clean --noconfirm UI.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Appointments-Windows
          path: dist/Appointments/**

      - name: Self Test
        run: |
          dist/Appointments/Appointments.exe --self-test
