[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "abdrzakk-jpg", email = "abdrzakk.dz@gmail.com" }
]
requires-python = ">=3.8"
dependencies = [
    "apscheduler==3.11.0",
    "cefpython3==66.1 ; sys_platform == 'win32'",
    "fastapi[standard]==0.124.4",
    "loguru==0.7.3",
    "pydantic==2.10.6",
    "pyinstaller==6.16.0",
    "python-dotenv==1.0.1",
    "pywebview==5.4",
    "requests==2.28.2",
    "rich==13.9.4",
    "scalar-fastapi==1.4.3",
    "setuptools==69.5.1",
    "sqlalchemy==2.0.43",
    "wheel==0.45.1",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
